[workspace]
members = ["crates/*", "examples/*"]
resolver = "2"

[workspace.package]
version = "0.10.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
edition = "2024"
repository = "https://github.com/mbrea-c/bevy_animation_graph"

[workspace.dependencies]
bevy_animation_graph_proc_macros = { version = "0.10.0", path = "./crates/bevy_animation_graph_proc_macros" }
bevy_animation_graph = { version = "0.10.0", path = "./crates/bevy_animation_graph" }
bevy_animation_graph_core = { version = "0.10.0", path = "./crates/bevy_animation_graph_core" }
bevy_animation_graph_builtin_nodes = { version = "0.10.0", path = "./crates/bevy_animation_graph_builtin_nodes" }

bevy = { git = "https://github.com/bevyengine/bevy", branch = "main" }
avian3d = { git = "https://github.com/slyedoc/avian", branch = "bevy-main" }

egui_dock = "0.18"
egui-notify = { version = "0.21" }
egui = { version = "0.33" }
egui_extras = { version = "0.33", features = ["all_loaders"] }
bevy_egui = { git = "https://github.com/slyedoc/bevy_egui", branch = "bevy-main" }
bevy-inspector-egui = { git = "https://github.com/slyedoc/bevy-inspector-egui", branch = "bevy-main" }

ron = "0.10.1"
serde = { version = "1.0" }

[patch.crates-io]
parry3d = { git = "https://github.com/slyedoc/parry", branch = "bevy-main" }
parry3d-f64 = { git = "https://github.com/slyedoc/parry", branch = "bevy-main" }
glamx = { git = "https://github.com/slyedoc/glamx", branch = "bevy-main" }
