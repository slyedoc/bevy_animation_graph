[workspace]
members = [
    "crates/bevy_animation_graph",
    "crates/bevy_animation_graph_core",
    "crates/bevy_animation_graph_builtin_nodes",
    "crates/bevy_animation_graph_proc_macros",
]
# PARKED on this branch: the editor and its examples ride egui + bevy_egui, which pull
# bevy_render and a wgpu that cannot co-resolve with the render-free aurora bevy. The
# runtime crates are what zero consumes; the editor comes back as its own workspace.
exclude = ["crates/bevy_animation_graph_editor", "examples"]
resolver = "2"

[workspace.package]
version = "0.10.0"
license = "MIT OR Apache-2.0"
readme = "README.md"
edition = "2024"
repository = "https://github.com/mbrea-c/bevy_animation_graph"

[workspace.dependencies]
bevy_animation_graph_proc_macros = { version = "0.10.0", path = "./crates/bevy_animation_graph_proc_macros" }
bevy_animation_graph = { version = "0.10.0", path = "./crates/bevy_animation_graph" }
bevy_animation_graph_core = { version = "0.10.0", path = "./crates/bevy_animation_graph_core" }
bevy_animation_graph_builtin_nodes = { version = "0.10.0", path = "./crates/bevy_animation_graph_builtin_nodes" }

# zero and aurora ride a render-free bevy (the pure-Vulkan RT renderer replaces bevy_render),
# so the runtime crates must not drag bevy_render back in through feature unification. This
# is aurora's feature set; the editor and examples add what they need on top of it.
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    "bevy_curve",
    "default_app",
    "default_platform",
    "common_api",
    "std",
    "multi_threaded",
    "scene",
    "serialize",
    "bevy_animation",
    "bevy_camera",
    "bevy_light",
    "bevy_mesh",
    "bevy_image",
    "bevy_color",
    "bevy_gltf",
    "bevy_gizmos",
] }
avian3d = { git = "https://github.com/avianphysics/avian", branch = "main", default-features = false, features = [
    "3d",
    "parry-f32",
    "default-collider",
] }

egui_dock = "0.18"
egui-notify = { version = "0.21" }
egui = { version = "0.33" }
egui_extras = { version = "0.33", features = ["all_loaders"] }
bevy_egui = { git = "https://github.com/slyedoc/bevy_egui", branch = "bevy-main" }
bevy-inspector-egui = { git = "https://github.com/slyedoc/bevy-inspector-egui", branch = "bevy-main" }

ron = "0.10.1"
serde = { version = "1.0" }

[patch."https://github.com/bevyengine/bevy"]
bevy = { git = "https://github.com/slyedoc/bevy", branch = "aurora" }
bevy_a11y = { git = "https://github.com/slyedoc/bevy", branch = "aurora" }
